services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: selfx
      POSTGRES_USER: selfx
      POSTGRES_PASSWORD: selfx
    ports:
      - "5432:5432"
    volumes:
      - selfx-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  typesense:
    image: typesense/typesense:27.1
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: selfx-dev-key
      TYPESENSE_ENABLE_CORS: "true"
    ports:
      - "8108:8108"
    volumes:
      - selfx-typesense:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  selfx-postgres:
  selfx-typesense:
