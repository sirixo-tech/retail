[program:selfx-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/retail/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/selfx-worker.log
stopwaitsecs=3600
