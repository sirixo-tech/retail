# SelfX Retail Enterprise - Production Nginx Reverse Proxy & Load Balancer
# Supports Laravel 11 Backend (PHP-FPM) + Next.js Applications (Admin, Console, Storefront)

upstream laravel_backend {
    server 127.0.0.1:9000;
    keepalive 32;
}

upstream nextjs_superadmin {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream nextjs_console {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream nextjs_storefront {
    server 127.0.0.1:3003;
    keepalive 16;
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name app.selfx.in admin.selfx.in shop.selfx.in *.selfx.in;
    return 301 https://$host$request_uri;
}

# 1. Platform Super Admin (admin.selfx.in)
server {
    listen 443 ssl http2;
    server_name admin.selfx.in;

    ssl_certificate /etc/letsencrypt/live/admin.selfx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.selfx.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 64M;

    # API Proxy to Laravel
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js App
    location / {
        proxy_pass http://nextjs_superadmin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Tenant Store Management Console & POS (app.selfx.in)
server {
    listen 443 ssl http2;
    server_name app.selfx.in;

    ssl_certificate /etc/letsencrypt/live/app.selfx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.selfx.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://nextjs_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Customer Online Storefront (shop.selfx.in & tenant subdomains)
server {
    listen 443 ssl http2;
    server_name shop.selfx.in *.selfx.in;

    ssl_certificate /etc/letsencrypt/live/shop.selfx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.selfx.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://nextjs_storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
