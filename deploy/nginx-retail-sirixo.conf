# Sirixo Retail Enterprise - Production Nginx Reverse Proxy & Load Balancer
# Domain: retail.sirixo.com
# Supports Laravel 11 Backend + Next.js Monorepo (Admin, Console, Storefront)

upstream laravel_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream nextjs_superadmin {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream nextjs_console {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream nextjs_storefront {
    server 127.0.0.1:3003;
    keepalive 16;
}

# -------------------------------------------------------------
# 1. HTTP to HTTPS Auto-Redirect
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name retail.sirixo.com admin.retail.sirixo.com shop.retail.sirixo.com *.retail.sirixo.com;
    return 301 https://$host$request_uri;
}

# -------------------------------------------------------------
# 2. Platform Super Admin (admin.retail.sirixo.com)
# -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.retail.sirixo.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/retail.sirixo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail.sirixo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 64M;

    # API Proxy to Laravel 11 Backend
    location /api/ {
        proxy_pass http://laravel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Super Admin App (Port 3001)
    location / {
        proxy_pass http://nextjs_superadmin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------
# 3. Tenant Store Management Console & POS (retail.sirixo.com)
# -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name retail.sirixo.com;

    ssl_certificate /etc/letsencrypt/live/retail.sirixo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail.sirixo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64M;

    # API Proxy to Laravel 11 Backend
    location /api/ {
        proxy_pass http://laravel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Console & POS App (Port 3002)
    location / {
        proxy_pass http://nextjs_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------
# 4. Customer Online Storefront (shop.retail.sirixo.com & subdomains)
# -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.retail.sirixo.com *.retail.sirixo.com;

    ssl_certificate /etc/letsencrypt/live/retail.sirixo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail.sirixo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32M;

    # API Proxy to Laravel 11 Backend
    location /api/ {
        proxy_pass http://laravel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Storefront App (Port 3003)
    location / {
        proxy_pass http://nextjs_storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
