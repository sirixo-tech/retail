# Sirixo Retail - Single Unified Domain Production Nginx Configuration
# Domain: retail.sirixo.com
# Only 1 DNS Record Required: retail.sirixo.com -> Server IP

upstream laravel_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream console_and_pos {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream customer_storefront {
    server 127.0.0.1:3003;
    keepalive 16;
}

upstream platform_superadmin {
    server 127.0.0.1:3001;
    keepalive 16;
}

# 1. HTTP to HTTPS Auto-Redirect
server {
    listen 80;
    listen [::]:80;
    listen 13.200.170.195:80;
    server_name retail.sirixo.com;
    return 301 https://$host$request_uri;
}

# 2. Main HTTPS Server Block (Single Domain: retail.sirixo.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 13.200.170.195:443 ssl;
    http2 on;
    server_name retail.sirixo.com;

    # SSL Certificate (managed automatically by Certbot)
    ssl_certificate /etc/letsencrypt/live/retail.sirixo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail.sirixo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 64M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # -----------------------------------------------------------------
    # A. Backend API Requests (/api/*)
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://laravel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Uploaded Media & Logos (/storage/*)
    location /storage/ {
        alias /var/www/retail/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # -----------------------------------------------------------------
    # B. Customer Online Storefront Assets & Routes
    # -----------------------------------------------------------------
    location /store/_next/ {
        proxy_pass http://customer_storefront/_next/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location ~* ^/(org/|p/|store|cart|track|account) {
        proxy_pass http://customer_storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------
    # C. Platform Super Admin Control Center Routes & Assets
    # -----------------------------------------------------------------
    location /superadmin {
        proxy_pass http://platform_superadmin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------
    # D. Tenant Store Management, POS, Billing, Login (Default: /)
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://console_and_pos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
